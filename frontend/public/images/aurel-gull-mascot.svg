<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <!--
    观澜 AUREL · AI 职业顾问「小鸥」吉祥物（原创矢量）：
    圆润一体化头身的白色海鸥，双翼舒展轻覆身侧，脚下两层静水微澜。
    设计原则：几何简洁、适度留白、温和聪明有陪伴感；
    清亮蓝（#4D83D6）、深蓝（#315FAD）、淡天蓝（#BDD8FC）与白色。
    与 GullMascot.tsx 同源，改动时两处同步。
  -->
  <defs>
    <linearGradient id="gull-body" x1="48" y1="12" x2="48" y2="82" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EAF3FF"/>
    </linearGradient>
    <linearGradient id="gull-wing" x1="24" y1="48" x2="24" y2="66" gradientUnits="userSpaceOnUse">
      <stop stop-color="#DCEBFF"/>
      <stop offset="1" stop-color="#BDD8FC"/>
    </linearGradient>
  </defs>

  <!-- 头身一体的圆润轮廓 -->
  <path d="M48 12.5C58.5 12.5 66.5 20.5 66.5 30.5C66.5 37.5 63.5 43.5 58.8 47.6C65.5 53.8 68 62.5 64.2 70.2C60.2 78.3 54.6 81.8 48 81.8C41.4 81.8 35.8 78.3 31.8 70.2C28 62.5 30.5 53.8 37.2 47.6C32.5 43.5 29.5 37.5 29.5 30.5C29.5 20.5 37.5 12.5 48 12.5Z"
        fill="url(#gull-body)" stroke="#4D83D6" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- 腹部淡色内衬 -->
  <ellipse cx="48" cy="63.5" rx="10.5" ry="9" fill="#F0F7FF"/>
  <!-- 双翼：自肩部向外轻展，翼尖微扬 -->
  <path d="M32.2 46.5C23 49 17.2 57.2 18.8 65.8C26 64.8 32 59 34.2 51.8C33.6 49.8 33 48 32.2 46.5Z"
        fill="url(#gull-wing)" stroke="#4D83D6" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M63.8 46.5C73 49 78.8 57.2 77.2 65.8C70 64.8 64 59 61.8 51.8C62.4 49.8 63 48 63.8 46.5Z"
        fill="url(#gull-wing)" stroke="#4D83D6" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- 头顶小羽尖 -->
  <path d="M48 12.5C47.4 9.2 49 6.6 51.6 6" stroke="#4D83D6" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <!-- 眼睛：明亮温和 -->
  <circle cx="40.5" cy="32.5" r="2.5" fill="#315FAD"/>
  <circle cx="55.5" cy="32.5" r="2.5" fill="#315FAD"/>
  <circle cx="41.4" cy="31.6" r="0.9" fill="#FFFFFF"/>
  <circle cx="56.4" cy="31.6" r="0.9" fill="#FFFFFF"/>
  <!-- 极淡腮红 -->
  <ellipse cx="35.8" cy="39.8" rx="3.1" ry="2.1" fill="#DCEBFF"/>
  <ellipse cx="60.2" cy="39.8" rx="3.1" ry="2.1" fill="#DCEBFF"/>
  <!-- 喙：圆润小三角 -->
  <path d="M43.6 40.6H52.4L48 46.8Z" fill="#4D83D6" stroke="#4D83D6" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- 脚下静水微澜 -->
  <path d="M19 89.5Q26 85 33 89.5T47 89.5T61 89.5T75 89.5" stroke="#BDD8FC" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M31 94.5Q37 91 43 94.5T55 94.5T67 94.5" stroke="#4D83D6" stroke-width="2.2" stroke-linecap="round" opacity="0.45" fill="none"/>
</svg>
